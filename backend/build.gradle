plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.acme'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // M1 persistence. Flyway owns the schema; Hibernate ddl-auto is banned by NFR-5.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // M2 authentication (FR-1). jjwt is split into an API jar compiled against and implementation
    // jars needed only at runtime; version verified against Maven Central (ADR-0002).
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Repository tests run against a real PostgreSQL binary, not H2 (ADR-0001). Docker is not
    // installed on this machine, so the Zonky provider -- which downloads and forks an actual
    // postgres process -- is used instead of Testcontainers.
    testImplementation 'io.zonky.test:embedded-database-spring-test:2.6.0'
    // The Spring integration does not pull the provider transitively -- it fails at runtime with
    // "You have to add the following dependency: io.zonky.test:embedded-postgres" -- so it is
    // declared explicitly. This is the artifact that forks the actual postgres process.
    testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
    // Pins the PostgreSQL binary as close to production as Zonky currently offers. Neon actually
    // runs PostgreSQL 18 (discovered by live verification, ADR-0007); Zonky's newest Windows
    // binary is 17.5.0, with no 18.x yet. 17.5.0 is also the newest version Flyway 11.7.2 declares
    // official support for, so this is the closest match both toolchains currently permit.
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.5.0')
}

tasks.named('test') {
    useJUnitPlatform()
    // NFR-3: surface test results in the console so "tests pass" is an observation,
    // not a claim. CLAUDE.md section 4 forbids reporting unverified results.
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}
