# Test-only configuration, loaded alongside the main application.yml. It is on the test classpath
# only -- the packaged application never contains it.
#
# The JWT secret below is a dummy for the test suite: it signs tokens that exist only inside a test
# JVM and protect nothing. It is not a production default (application.yml has none: JWT_SECRET
# defaults to empty and the application refuses to start without a real one -- NFR-4, asserted by
# JwtPropertiesTest#applicationYml_hasNoCommittedSecret).
app.security.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long!!
app.security.jwt.expiry-minutes=60
