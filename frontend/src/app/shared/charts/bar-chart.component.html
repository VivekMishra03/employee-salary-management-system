<figure class="chart">
  @if (rows().length === 0) {
    <p class="empty">No data to chart.</p>
  } @else {
    <div class="bars" aria-hidden="true">
      @for (row of rows(); track $index) {
        <div class="bar-row" [attr.title]="row.title">
          <span class="bar-label">{{ row.label }}</span>
          <span class="track">
            <span class="bar" [style.width.%]="row.size" [style.left.%]="row.start"></span>
          </span>
          <span class="bar-value">{{ row.valueText }}</span>
        </div>
      }
    </div>
    <table class="visually-hidden">
      <caption>{{ caption() }}</caption>
      <tbody>
        @for (row of rows(); track $index) {
          <tr><th scope="row">{{ row.label }}</th><td>{{ row.valueText }}</td></tr>
        }
      </tbody>
    </table>
  }
</figure>
