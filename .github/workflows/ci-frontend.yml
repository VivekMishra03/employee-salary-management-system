name: CI Frontend

# Runs only when frontend code changes. A backend-only or docs-only push does not start this
# workflow at all, so the two stacks build and fail independently despite sharing one repository
# (see docs/adr/0005).
#
# The workflow file itself is in the path filter: a change to how the frontend is built must
# re-verify the frontend.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  build:
    name: Frontend (Angular 21, TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      # Dates are the money-adjacent bug class here: an effective date shifted by a day is a raise
      # recorded for the wrong month. GitHub runners are UTC, and in UTC toISOString() and Date.parse
      # happen to give the right calendar day, so such bugs pass silently. The suite therefore runs
      # once east of UTC and once west of it, where they fail. The production build does not depend
      # on the zone and runs in the first job only.
      fail-fast: false
      matrix:
        tz: [Pacific/Auckland, America/Los_Angeles]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome
        # Karma drives a real browser (docs/adr/0004). Installed explicitly rather than relying on
        # whatever the runner image happens to ship, so the suite does not break on an image update.
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Unit tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          TZ: ${{ matrix.tz }}
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Production build
        if: matrix.tz == 'Pacific/Auckland'
        run: npm run build -- --configuration production
